<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>访问记录 · 今天吃啥</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #f6f7f9; color: #1f2328; }
header { padding: 14px 18px; background: #fff; border-bottom: 1px solid #e5e7eb; }
h1 { margin: 0; font-size: 17px; }
.sub { color: #8b949e; font-size: 12px; margin-top: 3px; }
#gate { padding: 18px; max-width: 460px; }
#gate input { width: 100%; padding: 9px 11px; border: 1px solid #d0d7de; border-radius: 8px; font-size: 15px; }
#gate button { margin-top: 10px; padding: 9px 18px; border: 0; border-radius: 8px;
  background: #1f2328; color: #fff; cursor: pointer; font-size: 14px; }
#app { display: none; }
#bar { display: flex; gap: 10px; align-items: center; padding: 10px 18px;
  background: #fff; border-bottom: 1px solid #e5e7eb; font-size: 13px; color: #57606a; }
#bar button { padding: 6px 12px; border: 1px solid #d0d7de; border-radius: 7px; background: #fff;
  cursor: pointer; font-size: 13px; }
#bar button.on { background: #1f2328; color: #fff; border-color: #1f2328; }
#list { padding: 6px 0 20px; }
.row { display: flex; align-items: baseline; gap: 10px; padding: 9px 18px;
  border-bottom: 1px solid #f2f4f7; background: #fff; font-size: 14px; }
.row .time { color: #57606a; font-variant-numeric: tabular-nums; width: 108px; flex: none; }
.row .ip { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #0b62d0;
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .dev { flex: none; font-size: 12px; color: #57606a; width: 52px; text-align: right; }
.row .page { flex: none; font-size: 12px; color: #8b949e; width: 74px; text-align: right; }
.empty { padding: 20px 18px; color: #8b949e; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>👀 访问记录</h1>
  <div class="sub">最近谁来看过这个站 · 密码同删除经典馆子</div>
</header>

<div id="gate">
  <input id="pw" type="password" placeholder="输入密码后回车" autocomplete="off">
  <button id="go">进入</button>
</div>

<div id="app">
  <div id="bar">
    <span>最近 <b id="n">—</b> 次访问</span>
    <button id="btn-refresh">刷新</button>
    <button id="btn-auto">自动刷新</button>
  </div>
  <div id="list"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let token = sessionStorage.getItem('df_token') || '';
let timer = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function device(ua) {
  const u = (ua || '').toLowerCase();
  if (!u) return '未知';
  if (/python|curl|wget|httpx|okhttp|go-http|bot|spider/.test(u)) return '机器';
  if (/iphone|android|harmony|miui|huawei|mobile/.test(u)) return '手机';
  if (/ipad|tablet/.test(u)) return '平板';
  return '电脑';
}

function pageName(path) {
  if (path === '/') return '主页';
  if (path === '/admin.html') return '日志页';
  if (path.startsWith('/api/')) return '接口';
  if (path === '/app.js' || path === '/style.css' || path.startsWith('/favicon')) return '资源';
  return '其它';
}

async function load() {
  try {
    const r = await fetch('/api/admin/logs?limit=60&files=1', {
      headers: { 'X-Admin-Password': token }, cache: 'no-store',
    });
    if (r.status === 403) { sessionStorage.removeItem('df_token'); location.reload(); return; }
    const items = (await r.json()).data.items || [];
    // 只显示“看页面”的访问，接口/资源噪音去掉
    const visits = items.filter(e => e.method === 'GET' && (e.path === '/' || e.path === '/admin.html' || e.path.startsWith('/api/')));
    const people = visits.filter(e => pageName(e.path) !== '接口');
    $('#n').textContent = people.length || visits.length;
    $('#list').innerHTML = (people.length ? people : visits).slice(0, 40).map(e => `
      <div class="row">
        <span class="time">${esc((e.t || '').slice(5))}</span>
        <span class="ip" title="${esc(e.ip)}">${esc(e.ip)}</span>
        <span class="dev">${device(e.ua)}</span>
        <span class="page">${pageName(e.path)}</span>
      </div>`).join('') || '<div class="empty">还没有访问记录</div>';
  } catch (e) {
    $('#list').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

function start() {
  $('#gate').style.display = 'none';
  $('#app').style.display = 'block';
  load();
}

$('#go').onclick = () => {
  const v = $('#pw').value.trim();
  if (!v) return;
  token = v; sessionStorage.setItem('df_token', v); start();
};
$('#pw').onkeydown = (e) => { if (e.key === 'Enter') $('#go').click(); };
$('#btn-refresh').onclick = load;
$('#btn-auto').onclick = () => {
  const b = $('#btn-auto');
  if (timer) { clearInterval(timer); timer = null; b.classList.remove('on'); return; }
  timer = setInterval(load, 8000); b.classList.add('on');
};
if (token) start();
</script>
</body>
</html>
