<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天吃啥</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="layout">
  <main id="map-pane">
    <form id="map-search-form" class="map-search">
      <input id="map-search-input" placeholder="搜商家：饺子、星巴克、火锅…" autocomplete="off">
      <button type="submit">搜索</button>
    </form>
    <div id="map"></div>
    <div id="map-fallback" hidden></div>
    <div id="map-hint">右键地图：设置出发点 / 加入经典馆子</div>
    <div id="map-menu" class="map-menu" hidden>
      <button id="mm-origin">📍 设为出发点</button>
      <button id="mm-rest">⭐ 加入经典馆子</button>
      <button id="mm-fix" hidden>📌 校正店的位置</button>
    </div>
    <div id="poi-popup" class="poi-popup" hidden>
      <button id="poi-close" class="poi-close" type="button">×</button>
      <div class="poi-body" id="poi-body"></div>
    </div>
    <div id="name-dialog" class="dialog" hidden>
      <div class="dialog-title">加入经典馆子</div>
      <div class="dialog-sub" id="dialog-sub"></div>
      <label class="dialog-label" for="dialog-name">店名（不对可以直接改）</label>
      <input id="dialog-name" type="text" autocomplete="off">
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn" type="button">取消</button>
        <button id="dialog-ok" class="btn primary" type="button">加入</button>
      </div>
    </div>
    <div id="delete-dialog" class="dialog" hidden>
      <div class="dialog-title">删除经典馆子</div>
      <div class="dialog-sub" id="delete-sub"></div>
      <label class="dialog-label" for="delete-password">请输入删除密码</label>
      <input id="delete-password" type="password" autocomplete="off">
      <div class="dialog-actions">
        <button id="delete-cancel" class="btn" type="button">取消</button>
        <button id="delete-ok" class="btn primary" type="button">删除</button>
      </div>
    </div>
    <button id="btn-panel-toggle" class="panel-toggle" title="收起/展开">«</button>
  </main>
  <aside id="panel">
    <header>
      <div class="site-head">
        <img src="/logo.png" alt="logo" class="site-logo">
        <h1 id="site-name">今天吃啥</h1>
        <div class="head-actions">
          <button id="btn-settings" class="map-settings" title="设置">⚙</button>
        </div>
        <div id="settings-menu" class="settings-menu" hidden>
          <div class="settings-title">列表排序</div>
          <label class="settings-item"><input type="radio" name="sortBy" value="distance" checked> 按距离排序</label>
          <label class="settings-item"><input type="radio" name="sortBy" value="rating"> 按打分排序</label>
        </div>
      </div>
      <div id="origin-badge" class="origin-badge"></div>
      <form id="search-form">
        <input id="search-input" placeholder="搜饺子、面、火锅…" autocomplete="off">
        <button type="submit">搜</button>
      </form>
      <div id="chips"></div>
    </header>
    <section id="daily-card"></section>
    <div id="list-count" class="list-count"></div>
    <section id="list"></section>
    <footer>
      <button id="btn-random" class="btn">🎲 区域随机</button>
      <button id="btn-weighted" class="btn">🏆 高分优先</button>
      <button id="btn-classic" class="btn star-btn"><span class="star">⭐</span> 经典馆子</button>
      <button id="btn-radar" class="btn radar-btn">🍜 网络推荐</button>
      <div id="rating-menu" class="menu" hidden>
        <button data-r="0" class="active">不限评分</button>
        <button data-r="4.5">4.5 分以上</button>
        <button data-r="4">4 分以上</button>
        <button data-r="3.5">3.5 分以上</button>
      </div>
      <div id="radius-row"></div>
      <label class="classic-check"><input type="checkbox" id="chk-classic"> 显示经典馆子</label>
      <label class="classic-check"><input type="checkbox" id="chk-radar"> 显示网络推荐</label>
    </footer>
  </aside>
</div>
<script src="/app.js"></script>
</body>
</html>
